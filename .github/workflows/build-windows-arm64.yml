name: Windows arm64 build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-windows-arm64:
    needs: build
    runs-on: windows-11-arm
    environment: packaging
    permissions:
      contents: read

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $env:USERPROFILE\flutter
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\flutter\bin"
          & "$env:USERPROFILE\flutter\bin\flutter.bat" --version

      - name: Verify native arm64 toolchain
        run: |
          $dartVersion = & "$env:USERPROFILE\flutter\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVersion
          if ($dartVersion -notmatch 'windows_arm64') {
            Write-Error "Dart SDK is not windows_arm64 - Flutter fell back to x64"
            exit 1
          }

      - name: Dependencies
        run: flutter pub get

      - name: Compile for Windows
        run: flutter build windows

      - name: Zip compiled files
        run: Compress-Archive -Path build/windows/arm64/runner/Release/* -DestinationPath "amethoughts-${{ needs.build.outputs.version }}-windows-arm-64.zip"

      - name: Upload signed zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm-64
          path: amethoughts-${{ needs.build.outputs.version }}-windows-arm-64.zip
          if-no-files-found: error