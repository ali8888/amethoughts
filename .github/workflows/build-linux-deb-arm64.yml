name: Linux deb arm64 build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-deb-arm64:
    needs: build
    runs-on: ubuntu-22.04-arm
    container: fedora:45

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y rpm patchelf clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter --version

      - name: Enable fastforge
        run: dart pub global activate fastforge

      - name: Build deb package
        run: PATH="$PATH:$HOME/.pub-cache/bin" fastforge release --name=release --jobs=linux-deb

      - name: Find deb file
        id: find_deb
        run: |
            TEMP_DEB_PATH=$(find dist -regextype posix-extended -regex ".*/amethoughts-${{ needs.build.outputs.version }}*\+[0-9]+-linux\.deb")
            DEB_PATH="amethoughts-${{ needs.build.outputs.version }}-linux-arm64.deb"
            mv "$TEMP_DEB_PATH" "$DEB_PATH"
            echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT

      - name: Check if deb file exists
        id: check_file
        run: |
          if [[ ! -f "${{ steps.find_deb.outputs.deb_path }}" ]]; then
            echo "File not found: ${{ steps.find_deb.outputs.deb_path }}"
            exit 1
          fi

      - name: Upload deb file
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb-arm64
          path: ${{ steps.find_deb.outputs.deb_path }}