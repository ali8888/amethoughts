name: Android build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-android:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6

        - name: Decode key.properties file
          env:
            ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          run: echo $ENCODED_STRING | base64 -di > android/key.properties

        - name: Decode android-keystore.jks file
          env:
            ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
          run: echo $ENCODED_STRING | base64 -di > android/app/amethoughts-keystore.jks

        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '25'

        - uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ env.FLUTTER_VERSION }}
            channel: "stable"

        - run: flutter pub get
        - run: flutter build apk --release

        - name: Rename APK
          run: |
            cp build/app/outputs/flutter-apk/app-release.apk \
              amethoughts-${{ needs.build.outputs.version }}-android.apk

        - uses: actions/upload-artifact@v6
          with:
            name: android
            path: amethoughts-${{ needs.build.outputs.version }}-android.apk