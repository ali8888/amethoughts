name: Linux appimage x64 build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
  
  build-appimage-x64:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6

        - uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ env.FLUTTER_VERSION }}

        - name: Install Linux dependencies
          run: |
            sudo apt update
            sudo apt install -y rpm patchelf clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev locate

        - name: Install dependencies for appimage
          run: |
            wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage"
            chmod +x appimagetool
            sudo mv appimagetool /usr/local/bin/

        - run: dart pub global activate fastforge
        - name: Build appimage package
          run: PATH="$PATH:$HOME/.pub-cache/bin" fastforge release --name=release --jobs=linux-appimage

        - name: Find appimage file
          id: find_appimage
          run: |
            TEMP_APPIMAGE_PATH=$(find dist -name "amethoughts-${{ needs.build.outputs.version }}-linux.AppImage")
            APPIMAGE_PATH="${TEMP_APPIMAGE_PATH%.AppImage}-x64.AppImage"
            mv "$TEMP_APPIMAGE_PATH" "$APPIMAGE_PATH"
            echo "appimage_path=$APPIMAGE_PATH" >> $GITHUB_OUTPUT

        - name: Check if appimage file exists
          id: check_file
          run: |
            if [[ ! -f "${{ steps.find_appimage.outputs.appimage_path }}" ]]; then
              echo "File not found: ${{ steps.find_appimage.outputs.appimage_path }}"
              exit 1
            fi

        - name: Upload appimage file
          uses: actions/upload-artifact@v6
          with:
            name: linux-appimage-x64
            path: ${{ steps.find_appimage.outputs.appimage_path }}