name: Linux rpm x64 build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
  
  build-linux-rpm-x64:
      needs: build
      runs-on: ubuntu-latest
      container: fedora:45

      steps:
        - uses: actions/checkout@v6

        - name: Install Linux dependencies
          run: dnf install -y clang cmake gtk3-devel ninja-build jq findutils which git patchelf rpm-build

        - uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ env.FLUTTER_VERSION }}
            channel: "stable"

        - run: dart pub global activate fastforge
        - name: Build rpm package
          run: PATH="$PATH:$HOME/.pub-cache/bin" fastforge release --name=release --jobs=linux-rpm

        - name: Find rpm file
          id: find_rpm
          run: |
            TEMP_RPM_PATH=$(find dist -regextype posix-extended -regex ".*/amethoughts-${{ needs.build.outputs.version }}*\+[0-9]+-linux\.rpm")
            RPM_PATH="amethoughts-${{ needs.build.outputs.version }}-linux-x64.rpm"
            mv "$TEMP_RPM_PATH" "$RPM_PATH"
            echo "rpm_path=$RPM_PATH" >> $GITHUB_OUTPUT

        - name: Check if rpm file exists
          id: check_file
          run: |
            if [[ ! -f "${{ steps.find_rpm.outputs.rpm_path }}" ]]; then
              echo "File not found: ${{ steps.find_rpm.outputs.rpm_path }}"
              exit 1
            fi

        - name: Upload rpm file
          uses: actions/upload-artifact@v6
          with:
            name: linux-rpm-x64
            path: ${{ steps.find_rpm.outputs.rpm_path }}