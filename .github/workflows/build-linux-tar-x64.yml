name: Linux tar x64 build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-linux-tar-x64:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6

        - uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ env.FLUTTER_VERSION }}

        - name: Install Linux dependencies
          run: |
            sudo apt update
            sudo apt install -y ninja-build libgtk-3-dev liblzma-dev

        - run: flutter pub get
        - run: flutter build linux --release

        - name: Package Linux
          run: |
            tar -czf amethoughts-${{ needs.build.outputs.version }}-linux-x64.tar.gz \
              -C build/linux/x64/release bundle

        - uses: actions/upload-artifact@v6
          with:
            name: linux-tar-x64
            path: amethoughts-${{ needs.build.outputs.version }}-linux-x64.tar.gz