name: Linux tar arm64 build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-linux-tar-arm64:
      needs: build
      runs-on: ubuntu-22.04-arm
      steps:
        - uses: actions/checkout@v6

        - name: Setup Flutter SDK
          run: |
            git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $HOME/flutter
            echo "$HOME/flutter/bin" >> $GITHUB_PATH
            $HOME/flutter/bin/flutter --version

        - name: Install Linux dependencies
          run: |
            sudo apt update
            sudo apt install -y ninja-build libgtk-3-dev liblzma-dev

        - run: flutter pub get
        - run: flutter build linux --release

        - name: Package Linux
          run: |
            tar -czf amethoughts-${{ needs.build.outputs.version }}-linux-arm64.tar.gz \
              -C build/linux/arm64/release bundle

        - uses: actions/upload-artifact@v6
          with:
            name: linux-tar-arm64
            path: amethoughts-${{ needs.build.outputs.version }}-linux-arm64.tar.gz