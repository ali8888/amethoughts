name: MacOS build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-macos:
      needs: build
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v6

        - uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ env.FLUTTER_VERSION }}

        - uses: actions/setup-node@v7
          with:
            node-version: 24
            package-manager-cache: false

        - run: npm install -g appdmg

        - run: dart pub global activate fastforge
        - name: Build macOS package
          run: fastforge release --name=release --jobs=macos

        - name: Find dmg file
          id: find_dmg
          run: |
            ESCAPED_VERSION=$(regex_escape "${{ needs.build.outputs.version }}")
            TEMP_DMG_PATH=$(find dist -regextype posix-extended -regex ".*/amethoughts-${ESCAPED_VERSION}*\+[0-9]+-macos\.dmg")
            DMG_PATH="${TEMP_DMG_PATH%.dmg}-arm64.dmg"
            mv "$TEMP_DMG_PATH" "$DMG_PATH"
            echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT

        - name: Check if dmg file exists
          id: check_file
          run: |
            if [[ ! -f "${{ steps.find_dmg.outputs.dmg_path }}" ]]; then
              echo "File not found: ${{ steps.find_dmg.outputs.dmg_path }}"
              exit 1
            fi

        - uses: actions/upload-artifact@v6
          with:
            name: macos
            path: ${{ steps.find_dmg.outputs.dmg_path }}