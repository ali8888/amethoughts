name: Build and Release Flutter App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  build-linux-tar-x64:
    uses: ./.github/workflows/build-linux-tar-x64.yml

  build-linux-tar-arm64:
    uses: ./.github/workflows/build-linux-tar-arm64.yml

  build-linux-deb-x64:
    uses: ./.github/workflows/build-linux-deb-x64.yml

  build-linux-deb-arm64:
    uses: ./.github/workflows/build-linux-deb-arm64.yml

  build-linux-rpm-x64:
    uses: ./.github/workflows/build-linux-rpm-x64.yml

  build-linux-rpm-arm64:
    uses: ./.github/workflows/build-linux-rpm-arm64.yml

  build-linux-appimage-x64:
    uses: ./.github/workflows/build-linux-appimage-x64.yml

  build-linux-appimage-arm64:
    uses: ./.github/workflows/build-linux-appimage-arm64.yml

  build-windows-x64:
    uses: ./.github/workflows/build-windows-x64.yml

  build-windows-arm64:
    uses: ./.github/workflows/build-windows-arm64.yml

  build-macos:
    uses: ./.github/workflows/build-macos.yml

  release:
    needs:
      - build
      - build-windows-x64
      - build-windows-arm64
      - build-macos
      - build-linux-tar-x64
      - build-linux-tar-arm64
      - build-linux-deb-x64
      - build-linux-deb-arm64
      - build-linux-rpm-x64
      - build-linux-rpm-arm64
      - build-linux-appimage-x64
      - build-linux-appimage-arm64
      - build-android

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ needs.build.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.build.outputs.version }}
          body_path: latest-changelog.md
          files: dist/*